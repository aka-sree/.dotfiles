# ==========================================================================
# 1. CORE SETTINGS
# ==========================================================================
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Change Prefix to Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Quality of Life
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 1000000

# ==========================================================================
# 2. NAVIGATION (Vim Style)
# ==========================================================================
set-window-option -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==========================================================================
# 3. PLUGINS (TPM)
# ==========================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin Visual Config
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# ==========================================================================
# 4. THE OVERRIDE (MUST BE AT THE VERY BOTTOM)
# ==========================================================================
# These lines force the plugins to stop renaming your windows

set-option -g allow-rename off
set-window-option -g automatic-rename off
set-option -g allow-passthrough off
set-option -g set-titles off

# Force Catppuccin to use the manual window name (#W) instead of the process
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# Final hard-lock for the status bar display
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W "

# --- NEOVIM RESTORE STRATEGY ---
# This tells tmux-resurrect to look for a Session.vim file to restore nvim
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

# Also, ensure nvim is in the list of programs to restore
set -g @resurrect-processes 'nvim'
